services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./model:/app/model:ro
    mem_limit: 3g
    expose:
      - "7860"

  caddy:                      # HTTPS reverse proxy (automatic Let's Encrypt certificate)
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
